[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-file-organizer"
version = "1.0.0"
description = "A CLI tool that organizes files into folders by file extension."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Lucky Samuel" }]
keywords = ["cli", "files", "organizer", "automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Utilities",
]

[project.scripts]
smart-file-organizer = "smart_file_organizer.cli:main"

[tool.setuptools]
packages = ["smart_file_organizer"]
